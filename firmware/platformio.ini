; Jacket firmware. See ../README.md for build, flash and OTA instructions.

[platformio]
default_envs = jacket_usb
; Optional and gitignored: copy secrets.ini.example to secrets.ini to enable WiFi + OTA.
extra_configs = secrets.ini

; Defaults used when secrets.ini is absent: WiFi and OTA stay off.
[secrets]
wifi_ssid =
wifi_password =
ota_password =
ota_ip =
gledopto_ip =

; Shared settings for the ESP32 builds.
[jacket]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
; 80 MHz is the lowest clock the radio allows; the core applies F_CPU at boot.
board_build.f_cpu = 80000000L
monitor_speed = 115200
lib_deps =
    fastled/FastLED@3.10.3
    h2zero/NimBLE-Arduino@2.5.1
; Every build ends by reporting the size of firmware.bin against the app slot
; it must fit in, and fails if it does not. min_spiffs.csv: 0x1E0000.
extra_scripts = post:tools/check_image_size.py
custom_max_image_bytes = 1966080

; The firmware version lives in src/config.h. build_src_flags apply to src/
; only, so changing them does not rebuild the framework and libraries.
;
; Development builds: the WiFi credentials from secrets.ini, and dev mode
; (WiFi + OTA + log stream) on at every boot.
[dev_flags]
build_src_flags =
    '-D JACKET_WIFI_SSID="${secrets.wifi_ssid}"'
    '-D JACKET_WIFI_PASSWORD="${secrets.wifi_password}"'
    '-D JACKET_OTA_PASSWORD="${secrets.ota_password}"'
    -D JACKET_FORCE_DEV_MODE=1

; First flash and recovery, over the USB serial port.
[env:jacket_usb]
extends = jacket
upload_protocol = esptool
upload_speed = 460800
build_src_flags =
    ${dev_flags.build_src_flags}
    '-D JACKET_BUILD="usb"'

; USB build that never embeds WiFi credentials, even when secrets.ini exists:
; WiFi and OTA are compiled in but can never start. For bench work on
; Bluetooth and LEDs.
[env:jacket_bench]
extends = jacket
upload_protocol = esptool
upload_speed = 460800
build_src_flags =
    '-D JACKET_BUILD="bench"'

; Build check only, never flashed: the same code paths as jacket_usb with
; made-up credentials, so the WiFi/OTA code is linked and sized without
; secrets.ini.
[env:jacket_ci]
extends = jacket
build_src_flags =
    '-D JACKET_BUILD="ci"'
    '-D JACKET_WIFI_SSID="ci-dummy"'
    '-D JACKET_WIFI_PASSWORD="ci-dummy-password"'
    '-D JACKET_OTA_PASSWORD="ci-dummy-ota"'
    -D JACKET_FORCE_DEV_MODE=1

; Wireless upload to a jacket already running a build with the same secrets.ini.
[env:jacket_ota]
extends = jacket
build_src_flags =
    ${dev_flags.build_src_flags}
    '-D JACKET_BUILD="ota"'
upload_protocol = espota
upload_port = ${secrets.ota_ip}
; host_port is fixed so one inbound firewall rule (TCP 45678) covers every upload.
upload_flags =
    --port=3232
    --host_port=45678
    --auth=${secrets.ota_password}

; The devkit with the microphone code running on GPIO 26 (data), 5 (word
; select) and 21 (clock), which are free on it. For measuring what the
; microphone task costs, or for an I2S microphone wired to those pins; with
; nothing wired the data pin floats and the jacket "hears" noise. No credentials.
[env:devkit_mic]
extends = jacket
upload_protocol = esptool
upload_speed = 460800
build_src_flags =
    '-D JACKET_BUILD="bench-mic"'
    -D JACKET_DEVKIT_MIC

; ---- Gledopto GL-C-010WL ---------------------------------------------------------
; The controller the jacket's strips are wired to. It has no USB or serial
; port: the first firmware goes in through the update page of the WLED it was
; sold with, later ones over WiFi (see ../README.md). Only the app is ever
; replaced, so the image must fit WLED's app slot: 0x180000 bytes.
[gledopto]
extends = jacket
board_build.partitions = partitions_wled_4mb.csv
custom_max_image_bytes = 1572864

; No credentials, like jacket_bench: WiFi and OTA can never start, and nothing
; in it can write the other app slot. Without the microphone: the plainest
; image, and the first one to install through WLED's page. Once installed it
; is replaced by going back to the previous firmware (README, "The way back")
; and installing from there.
[env:gledopto_bench]
extends = gledopto
build_src_flags =
    -D JACKET_BOARD_GLEDOPTO
    '-D JACKET_BUILD="gled-bench"'

; The same with the board's microphone built in (JACKET_GLEDOPTO_MIC).
[env:gledopto_bench_mic]
extends = gledopto
build_src_flags =
    -D JACKET_BOARD_GLEDOPTO
    -D JACKET_GLEDOPTO_MIC
    '-D JACKET_BUILD="gled-mic"'

; Build check only, never installed: the gledopto_ota code paths (microphone
; included) with made-up credentials, so the largest build is linked and
; sized without secrets.ini.
[env:gledopto_ci]
extends = gledopto
build_src_flags =
    -D JACKET_BOARD_GLEDOPTO
    -D JACKET_GLEDOPTO_MIC
    '-D JACKET_BUILD="gled-ci"'
    '-D JACKET_WIFI_SSID="ci-dummy"'
    '-D JACKET_WIFI_PASSWORD="ci-dummy-password"'
    '-D JACKET_OTA_PASSWORD="ci-dummy-ota"'
    -D JACKET_FORCE_DEV_MODE=1

; Everything: the microphone, and the credentials from secrets.ini.
; "pio run -e gledopto_ota" makes .pio/build/gledopto_ota/firmware.bin, a file
; for WLED's update page; "-t upload" sends it over WiFi to a board that
; already runs a build with the same secrets.ini.
[env:gledopto_ota]
extends = gledopto
build_src_flags =
    -D JACKET_BOARD_GLEDOPTO
    -D JACKET_GLEDOPTO_MIC
    ${dev_flags.build_src_flags}
    '-D JACKET_BUILD="gledopto"'
upload_protocol = espota
upload_port = ${secrets.gledopto_ip}
upload_flags =
    --port=3232
    --host_port=45678
    --auth=${secrets.ota_password}

; TEST ONLY, never worn: gledopto_bench that crashes on purpose two seconds
; after the boot guard has run, at every boot. Installed through WLED's update
; page it must be back in WLED after three crashes: the proof that a firmware
; which cannot start does not strand the board. No credentials.
[env:gledopto_crashtest]
extends = gledopto
build_src_flags =
    -D JACKET_BOARD_GLEDOPTO
    '-D JACKET_BUILD="gled-CRASH"'
    -D JACKET_TEST_CRASH_AFTER_MS=2000

; Host build: unit tests for lib/core, no ESP32 code.
; Needs a host g++ on PATH (on Windows: MinGW-w64). Run: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
; Only the golden-vector test uses it, to read protocol/vectors/v1.json.
lib_deps = bblanchon/ArduinoJson@7.4.2
; Windows: link the MinGW runtime statically, so the tests do not load a stale DLL from PATH.
extra_scripts = test/support/link_static_on_windows.py
